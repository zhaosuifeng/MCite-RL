# One question, two GRPO trajectories, one optimizer step on a single GPU.
defaults:
  - qwen25vl3b_grpo_smoke
  - _self_

data:
  train_batch_size: 1
  max_response_length: 256

actor_rollout_ref:
  actor:
    ppo_mini_batch_size: 2
  rollout:
    max_num_seqs: 1
    max_num_batched_tokens: 4352
    gpu_memory_utilization: 0.12
    limit_mm_per_prompt:
      image: 2

max_turns: 2
trainer:
  experiment_name: qwen3b-lowmem-smoke
  default_local_dir: checkpoints/wiki-visa/qwen3b-lowmem-smoke
